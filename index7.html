<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Document</title>
<style>
  body { background: #fcf3e8; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
  h2 { text-align: center; }
  form { width: 300px; margin: 0 auto 30px; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input, select, button { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; }
  button { margin-top: 16px; cursor: pointer; }
  .error { color: #a01010; font-size: 13px; font-weight: normal; }
  #colors { display: flex; flex-wrap: wrap; gap: 10px; }
  .card { flex: 1 1 250px; height: 120px; display: flex; align-items: center; justify-content: center; }
  .inner { background: rgba(255, 255, 255, 0.5); padding: 15px 30px; text-align: center; }
  .inner div { margin: 3px 0; }
</style>
</head>
<body>

<h2>Create new color</h2>
<form id="form">
  <label>Color: <span class="error" id="nameError"></span></label>
  <input type="text" id="name">

  <label>Type:</label>
  <select id="type">
    <option value="RGB">RGB</option>
    <option value="RGBA">RGBA</option>
    <option value="HEX">HEX</option>
  </select>

  <label>Code: <span class="error" id="codeError"></span></label>
  <input type="text" id="code">

  <button type="submit">Save</button>
</form>

<h2>All colors</h2>
<div id="colors"></div>

<script>
var colors = [];
function saveCookie() {
  var value = encodeURIComponent(JSON.stringify(colors));
  document.cookie = "colors=" + value + "; max-age=" + (3 * 60 * 60) + "; path=/";
}

function loadCookie() {
  var parts = document.cookie.split("; ");
  for (var i = 0; i < parts.length; i++) {
    if (parts[i].indexOf("colors=") === 0) {
      var value = parts[i].substring("colors=".length);
      try {
        colors = JSON.parse(decodeURIComponent(value));
      } catch (e) {
        colors = [];
      }
    }
  }
}

function checkName(name) {
  if (name === "") return "Color is required";
  if (!/^[a-zA-Zа-яА-ЯіїєґІЇЄҐ]+$/.test(name)) return "Color can only contain letters";
  for (var i = 0; i < colors.length; i++) {
    if (colors[i].name.toLowerCase() === name.toLowerCase()) return "Color already exists";
  }
  return "";
}

function checkCode(type, code) {
  var nums, i;

  if (type === "RGB") {
    nums = code.split(",");
    if (nums.length !== 3) return "RGB code must match the pattern [0-255], [0-255], [0-255]";
    for (i = 0; i < 3; i++) {
      if (!/^\d+$/.test(nums[i]()) || Number(nums[i]) > 255) {
        return "RGB code must match the pattern [0-255], [0-255], [0-255]";
      }
    }
  }

  if (type === "RGBA") {
    nums = code.split(",");
    var msg = "RGBA code must match the pattern [0-255], [0-255], [0-255], [0-1]";
    if (nums.length !== 4) return msg;
    for (i = 0; i < 3; i++) {
      if (!/^\d+$/.test(nums[i]()) || Number(nums[i]) > 255) return msg;
    }
    var a = nums[3]();
    if (!/^\d*\.?\d+$/.test(a) || Number(a) > 1) return msg;
  }

  if (type === "HEX") {
    if (!/^#[0-9a-fA-F]{6}$/.test(code)) return "HEX code must match the pattern #[0-9A-F]x6";
  }

  return "";
}

function render() {
  var box = document.getElementById("colors");
  box.innerHTML = "";

  for (var i = 0; i < colors.length; i++) {
    var c = colors[i];
    var bg;
    if (c.type === "RGB") bg = "rgb(" + c.code + ")";
    else if (c.type === "RGBA") bg = "rgba(" + c.code + ")";
    else bg = c.code;

    var card = document.createElement("div");
    card.className = "card";
    card.style.background = bg;
    card.innerHTML =
      '<div class="inner">' +
        '<div>' + c.name.toUpperCase() + '</div>' +
        '<div style="font-size:12px">' + c.type + '</div>' +
        '<div><b>' + c.code + '</b></div>' +
      '</div>';
    box.appendChild(card);
  }
}

document.getElementById("form").addEventListener("submit", function (e) {
  e.preventDefault();

  var name = document.getElementById("name").value();
  var type = document.getElementById("type").value;
  var code = document.getElementById("code").value();

  var nameErr = checkName(name);
  var codeErr = checkCode(type, code);

  document.getElementById("nameError").textContent = nameErr;
  document.getElementById("codeError").textContent = codeErr;

  if (nameErr !== "" || codeErr !== "") return;

  colors.push({ name: name, type: type, code: code });
  saveCookie();
  render();

  document.getElementById("name").value = "";
  document.getElementById("code").value = "";
});

loadCookie();
if (colors.length === 0) {
  colors = [
    { name: "yellowgreen", type: "RGB", code: "154, 205, 50" },
    { name: "darkcyan", type: "RGBA", code: "0, 139, 139, 1" },
    { name: "orangered", type: "HEX", code: "#FF4500" }
  ];
  saveCookie();
}
render();
</script>
</body>
</html>
